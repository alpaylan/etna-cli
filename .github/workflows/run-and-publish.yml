name: Run experiment and publish to Cloudflare Pages
# Reusable workflow: every workload's repo calls this with `uses:` to run an
# `etna experiment run` and publish the results (HTML + JSON + raw store +
# manifest) to a per-workload Cloudflare Pages project.
#
# What the caller does:
#   1. Adds .github/workflows/publish.yml with `uses:
#      alpaylan/etna-cli/.github/workflows/run-and-publish.yml@<ref>`
#   2. Sets the secrets CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID
#
# Default cf-pages-project is the workload's `name` from its `etna.toml`.

on:
  workflow_call:
    inputs:
      trials:
        description: 'Trials per (variant, property)'
        type: number
        default: 10
      timeout:
        description: 'Per-trial timeout in seconds'
        type: number
        default: 60
      cf-pages-project:
        description: 'Cloudflare Pages project to deploy into. Empty = use the workload name from etna.toml.'
        type: string
        default: ''
      etna-version:
        description: 'etna-cli release tag to install (e.g. v0.1.10). Empty = latest release.'
        type: string
        default: ''
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: true
      CLOUDFLARE_ACCOUNT_ID:
        required: true

# One deploy at a time; cancel a still-running older run if a newer push arrives.
concurrency:
  group: run-and-publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      deployments: write
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # marauders applies patches; full history avoids surprise reset behaviour
          # Submodules are inited later, after the SSH→HTTPS URL rewrite, so
          # this step doesn't fail on workloads whose `.gitmodules` uses
          # `git@github.com:` URLs (which have no key on hosted runners).

      # Workloads with submodules (e.g. etna-haskell-bst → etna-haskell-lib)
      # ship `.gitmodules` entries with `git@github.com:` URLs. Rewrite to
      # HTTPS once globally so any subsequent `git submodule …` works without
      # SSH keys, then init the submodules ourselves.
      - name: Init submodules over HTTPS
        shell: bash
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          if [ -f .gitmodules ]; then
            git submodule sync --recursive
            git submodule update --init --recursive
          fi

      # ---------- Read workload metadata --------------------------------
      - name: Detect language from etna.toml
        id: meta
        shell: bash
        run: |
          if [ ! -f etna.toml ]; then
            echo "::error::etna.toml not found at repo root"
            exit 1
          fi
          name=$(grep -E '^name *= *"' etna.toml | head -1 | sed -E 's/^name *= *"([^"]*)".*/\1/')
          language=$(grep -E '^language *= *"' etna.toml | head -1 | sed -E 's/^language *= *"([^"]*)".*/\1/' | tr '[:upper:]' '[:lower:]')
          if [ -z "$name" ] || [ -z "$language" ]; then
            echo "::error::Could not parse name/language from etna.toml"
            exit 1
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "language=$language" >> "$GITHUB_OUTPUT"
          if [ -n "${{ inputs.cf-pages-project }}" ]; then
            echo "project=${{ inputs.cf-pages-project }}" >> "$GITHUB_OUTPUT"
          else
            # Prefix the workload name with `etna-` because CF Pages
            # project names share a single global pages.dev namespace —
            # short workload names like `half`, `bst-rust`, `bst-haskell`
            # collide with other accounts' projects and the deploy 4xx's
            # silently. Callers can still override with `cf-pages-project`.
            echo "project=etna-$name" >> "$GITHUB_OUTPUT"
          fi
          echo "Detected workload: name=$name language=$language"

      # ---------- Per-language toolchain bootstrap + cache --------------
      # Rust toolchain channel: read from rust-toolchain.toml or rust-toolchain
      # if present, otherwise default to stable. Workloads that use unstable
      # features (e.g. etna-rust-bst's box_patterns mutation) ship a
      # rust-toolchain.toml pinning nightly.
      - name: Detect Rust channel
        if: steps.meta.outputs.language == 'rust'
        id: rust_channel
        shell: bash
        run: |
          channel="stable"
          if [ -f rust-toolchain.toml ]; then
            val=$(grep -E '^channel *= *' rust-toolchain.toml | head -1 | sed -E 's/.*= *"([^"]*)".*/\1/')
            [ -n "$val" ] && channel="$val"
          elif [ -f rust-toolchain ]; then
            val=$(tr -d '[:space:]' < rust-toolchain)
            [ -n "$val" ] && channel="$val"
          fi
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          echo "Rust channel: $channel"
      - name: Setup Rust
        if: steps.meta.outputs.language == 'rust'
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rust_channel.outputs.channel }}
      - name: Cache Rust
        if: steps.meta.outputs.language == 'rust'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ steps.meta.outputs.name }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-${{ steps.meta.outputs.name }}-

      # Pre-build manually so the compile diagnostic surfaces here. etna-cli's
      # `build_steps` driver captures stdout/stderr via `cmd.output()` and on
      # failure only prints `[✗] cargo build --release failed` — the actual
      # compile error is dropped on the floor (alpaylan/etna-cli build_steps
      # output buffering). Running cargo here means a later `etna experiment
      # run` no-ops the build (already cached).
      - name: Pre-build Rust workload (visible diagnostics)
        if: steps.meta.outputs.language == 'rust'
        shell: bash
        run: cargo build --release

      - name: Setup Haskell + Stack
        if: steps.meta.outputs.language == 'haskell'
        uses: haskell-actions/setup@v2
        with:
          enable-stack: true
          # Pin to a stack version known to be pre-cached on
          # actions/runner-images ubuntu-latest. Defaulting to 'latest'
          # routes through GHCup which has been flaky resolving the
          # newest 3.x release on hosted runners.
          stack-version: '2.15.7'
          # The build_steps for haskell workloads use `--no-system-ghc`
          # so stack downloads its own GHC; we don't pin ghc-version here.
      - name: Cache Stack
        if: steps.meta.outputs.language == 'haskell'
        uses: actions/cache@v4
        with:
          path: |
            ~/.stack
            .stack-work
          key: ${{ runner.os }}-stack-${{ steps.meta.outputs.name }}-${{ hashFiles('**/stack.yaml*', '**/*.cabal', '**/package.yaml') }}
          restore-keys: ${{ runner.os }}-stack-${{ steps.meta.outputs.name }}-

      - name: Setup OCaml
        if: steps.meta.outputs.language == 'ocaml'
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: '5.x'
      # `ocaml/setup-ocaml@v3` sets up opam + appends opam-env to GITHUB_ENV,
      # but does NOT install `dune` globally — workload steps.json setup_steps
      # call `dune --version` directly (no `opam exec --` wrapper) so dune
      # must be on PATH for plain bash. Install it via opam now.
      - name: Install OCaml workload deps
        if: steps.meta.outputs.language == 'ocaml'
        shell: bash
        run: |
          # ocaml/setup-ocaml@v3 finds BST.opam (or any *.opam at the repo
          # root) but does NOT auto-install its deps. Run `opam install .
          # --deps-only` so qcheck / crowbar / cmdliner / dune end up on the
          # switch before etna-cli's driver tries to build the workload.
          opam install -y . --deps-only --with-test
          # ocaml/setup-ocaml@v3 creates a workspace-local _opam switch but
          # doesn't export OPAMSWITCH. etna-cli's driver later runs
          # `opam exec -- dune build` from /tmp/etna-experiment/.../bst-ocaml
          # which is outside the workspace tree, so opam's cwd-walk can't
          # find _opam. Pin OPAMSWITCH to the absolute switch path so opam
          # picks it up no matter where it's invoked.
          echo "OPAMSWITCH=$(opam switch show --safe)" >> "$GITHUB_ENV"
          echo "$(opam var prefix)/bin" >> "$GITHUB_PATH"
      - name: Cache OCaml build artefacts
        if: steps.meta.outputs.language == 'ocaml'
        uses: actions/cache@v4
        with:
          path: |
            _build
          key: ${{ runner.os }}-ocaml-${{ steps.meta.outputs.name }}-${{ hashFiles('**/dune-project', '**/*.opam') }}
          restore-keys: ${{ runner.os }}-ocaml-${{ steps.meta.outputs.name }}-

      # Coq (Rocq) install on the host. We need coqc + QuickChick + ExtLib on
      # the host PATH because etna-cli's check/build commands (`coqc
      # --print-version`, `${workload_path}/build`) run via std::process::Command
      # outside any container — the previous docker-coq-action only made the
      # binaries available inside its container.
      - name: Setup OCaml for Coq via opam
        if: steps.meta.outputs.language == 'rocq' || steps.meta.outputs.language == 'coq'
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: '4.14.x'
          opam-repositories: |
            default: https://opam.ocaml.org
            coq-released: https://coq.inria.fr/opam/released
      - name: Install Coq + QuickChick (property-language) + ExtLib
        if: steps.meta.outputs.language == 'rocq' || steps.meta.outputs.language == 'coq'
        shell: bash
        run: |
          # Three-step install — opam's solver picks a build order that's
          # broken on coq-released for our target versions, so force the
          # ordering by hand:
          #   1. coq.8.18.0 (puts coqc on PATH)
          #   2. coq-elpi (puts the elpi loader on the coq loadpath)
          #   3. coq-quickchick (property-language branch) + coq-ext-lib.
          #
          # QuickChick is pinned to the `property-language` branch rather
          # than the released coq-quickchick.2.0.4, because the etna rocq
          # workloads use the `Fuzzy` typeclass (`Class Fuzzy (A : Type)
          # := { fuzz : A -> G A }.` defined in src/Classes.v) which only
          # exists on that branch — upstream's released line never merged
          # the property-language work.
          #
          # Coq 8.18 picked over 8.20 because 8.20 + coq-quickchick 2.0.x
          # pulls rocq-elpi.3.2.0 which has a broken dune layout (missing
          # _opam/.opam-switch/build/rocq-elpi.3.2.0/.../elpi_plugin.cmxs).
          opam install -y coq.8.18.0
          eval $(opam env)
          opam install -y coq-elpi
          eval $(opam env)
          # QuickChick property-language branch declares `(lang dune 2.8)`
          # but the modern dune 3.x emits "Multiple rules generated for
          # depDriver.ml: plugin/dune:31, file present in source tree"
          # because dune 3 walks `*.ml.cppo` files as if they alias an
          # ML source even though our explicit (rule (targets ...)) is
          # the real producer. Pin dune to 2.9.3 (the highest 2.x line)
          # so the build follows the older rule-resolution semantics.
          opam install -y dune.2.9.3
          eval $(opam env)
          # Clone QuickChick property-language and nuke the entire
          # `examples/` dir. It contains a broken Emacs lock symlink
          # (`examples/.#Fuzz.v` → an unresolvable user@host:pid string)
          # that breaks every later step that walks the tree. Then
          # commit the deletion so opam pin sees it — `opam pin add`
          # against a git working dir IGNORES uncommitted changes
          # ("Ignoring uncommitted changes" note in opam logs); it
          # pins to HEAD only. Without a commit, the broken symlink
          # stays in the pinned snapshot.
          rm -rf "$RUNNER_TEMP/quickchick-pl"
          git clone --depth 1 --branch property-language \
            https://github.com/QuickChick/QuickChick.git "$RUNNER_TEMP/quickchick-pl"
          ( cd "$RUNNER_TEMP/quickchick-pl" \
            && rm -rf examples \
            && git -c user.email=ci@etna -c user.name=ci-bot \
                  commit -am 'CI: strip examples/ (broken Emacs lock symlink)' )
          opam pin add -y --no-action coq-quickchick "$RUNNER_TEMP/quickchick-pl"
          opam install -y coq-quickchick coq-ext-lib
          echo "OPAMSWITCH=$(opam switch show --safe)" >> "$GITHUB_ENV"
          echo "$(opam var prefix)/bin" >> "$GITHUB_PATH"
      - name: Cache Coq opam switch
        if: steps.meta.outputs.language == 'rocq' || steps.meta.outputs.language == 'coq'
        uses: actions/cache@v4
        with:
          path: |
            ~/.opam
          # v2 invalidates poisoned cache: an earlier failed
          # coq-quickchick build left `_opam/.opam-switch/build/
          # coq-quickchick.dev/plugin/depDriver.ml` on disk; subsequent
          # runs restored that file alongside the cppo rule, dune saw
          # "Multiple rules generated for ..._build/.../depDriver.ml".
          key: ${{ runner.os }}-coq-${{ steps.meta.outputs.name }}-820-v2
          restore-keys: ${{ runner.os }}-coq-${{ steps.meta.outputs.name }}-820-v2

      - name: Install elan (Lean toolchain)
        if: steps.meta.outputs.language == 'lean'
        shell: bash
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Cache lake build (Lean)
        if: steps.meta.outputs.language == 'lean'
        uses: actions/cache@v4
        with:
          path: |
            ~/.elan
            **/.lake/build
            **/.lake/packages
          key: ${{ runner.os }}-lake-${{ steps.meta.outputs.name }}-${{ hashFiles('**/lean-toolchain', '**/lake-manifest.json') }}
          restore-keys: ${{ runner.os }}-lake-${{ steps.meta.outputs.name }}-

      # ---------- Install etna-cli ------------------------------------
      - name: Install etna-cli
        shell: bash
        run: |
          if [ -n "${{ inputs.etna-version }}" ]; then
            url="https://github.com/alpaylan/etna-cli/releases/download/${{ inputs.etna-version }}/etna-installer.sh"
          else
            url="https://github.com/alpaylan/etna-cli/releases/latest/download/etna-installer.sh"
          fi
          curl -LsSf "$url" | sh
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          # Verify installed
          "$HOME/.cargo/bin/etna" --version || true

      # ---------- Set up experiment + workload --------------------------
      # `etna setup` initialises ~/.etna/config.json (non-interactive) so
      # subsequent commands have a valid config to read.
      # `etna workload add` clones from a git URL. We pass the current repo's
      # URL + SHA so the workload mirrors what's in CI exactly.
      - name: Create experiment + add workload
        shell: bash
        run: |
          etna setup --overwrite || true
          mkdir -p /tmp/etna-experiment
          cd /tmp/etna-experiment
          etna experiment new ci-run
          cd ci-run
          # Note: --ref ${{ github.sha }} is correct intent but `etna workload add`
          # passes that to `git clone --branch` which doesn't accept SHAs (alpaylan/etna-cli#28).
          # Falling back to the default branch — fine for push-to-main triggers
          # since the default-branch HEAD == github.sha.
          etna workload add "https://github.com/${{ github.repository }}.git"
          ls tests/

      # ---------- Run + publish ----------------------------------------
      # Strategies are seeded into tests/<name>.json from etna.toml's
      # `strategies = [...]` field at workload-add time — no amend-test step
      # needed.
      - name: Run experiment
        shell: bash
        run: |
          cd /tmp/etna-experiment/ci-run
          test_name="${{ steps.meta.outputs.name }}"
          etna experiment run --tests "$test_name" --short-circuit \
            --params trials=${{ inputs.trials }} \
            --params timeout=${{ inputs.timeout }}

      - name: Bundle results into dist/
        shell: bash
        run: |
          cd /tmp/etna-experiment/ci-run
          etna experiment publish-page --output "$GITHUB_WORKSPACE/dist"
          ls -la "$GITHUB_WORKSPACE/dist"
          echo "--- size ---"
          du -sh "$GITHUB_WORKSPACE/dist"
          du -h "$GITHUB_WORKSPACE/dist"/*

      # ---------- Cloudflare Pages -------------------------------------
      # Wrangler's `pages deploy` does NOT auto-create the project — it
      # errors when the name is unknown. Create it first; ignore failures
      # (CLI returns non-zero when the project already exists).
      - name: Ensure Cloudflare Pages project exists
        uses: cloudflare/wrangler-action@v3
        continue-on-error: true
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages project create ${{ steps.meta.outputs.project }} --production-branch=main

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=${{ steps.meta.outputs.project }} --branch=main --commit-dirty=true

      - name: Print result URL
        shell: bash
        run: |
          echo "Deployed to https://${{ steps.meta.outputs.project }}.pages.dev/"
          echo "JSON endpoint: https://${{ steps.meta.outputs.project }}.pages.dev/report.json"
